<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La poesia riempie la Piazza — Bar Croazia</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Chiudi">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="sub-topline">
  <a class="back-btn" href="blog-articoli.html">&larr; Indietro</a>
  <span>Bar Croazia &middot; Bologna</span>
</div>

<div class="page">

  <div class="sub-hero">
    <span class="tag mono">06b</span>
    <h1>La poesia riempie la Piazza</h1>
    <div class="article-meta">
      <span class="article-author">Federico Taddia</span>
      <span class="article-date">30 Maggio 2026</span>
    </div>
  </div>

  <main class="sub-main">
    <div class="article-photo-wrap">
      <div>
        <div class="article-photo" id="articlePhoto">
          <img src="assets/img/blog/taddia-1.jpg" alt="La poesia riempie la Piazza — foto dell'articolo di Federico Taddia">
        </div>
        <span class="article-photo-hint">Tocca la foto per ingrandirla</span>
      </div>
    </div>
  </main>

  <footer>Bar Croazia &middot; movimento di poesia con poeti vivi</footer>

</div>

<script>
  var lightboxEl = document.getElementById('lightbox');
  var lightboxImgEl = document.getElementById('lightboxImg');

  function openLightbox(src){
    lightboxImgEl.src = src;
    lightboxEl.classList.remove('zoomed');
    lightboxEl.classList.add('open');
  }
  function closeLightbox(){
    lightboxEl.classList.remove('open');
    lightboxEl.classList.remove('zoomed');
    lightboxEl.scrollTop = 0;
    lightboxEl.scrollLeft = 0;
    lightboxImgEl.src = '';
  }
  lightboxEl.addEventListener('click', closeLightbox);
  lightboxImgEl.addEventListener('click', function(e){
    e.stopPropagation();
    lightboxEl.classList.toggle('zoomed');
  });
  document.getElementById('lightboxClose').addEventListener('click', function(e){
    e.stopPropagation();
    closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeLightbox();
  });

  document.getElementById('articlePhoto').addEventListener('click', function(){
    var img = this.querySelector('img');
    openLightbox(img.src);
  });
</script>

</body>
</html>
