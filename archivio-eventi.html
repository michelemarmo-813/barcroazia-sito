  <main class="sub-main">
    <section class="zine-section revealed">
      <!-- gli eventi si modificano nel file archivio-dati.js -->
      <div class="event-tile-list" id="archivio-lista"></div>
    </section>
  </main>

<script src="archivio-dati.js?v=dbbf4e16"></script>
<script>
  var revealEls = document.querySelectorAll('.zine-section');
  if('IntersectionObserver' in window){
    var revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('revealed');
          revealIO.unobserve(entry.target);
        }
      });
    }, { threshold:0.08, rootMargin:'0px 0px -40px 0px' });
    revealEls.forEach(function(el){ revealIO.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('revealed'); });
  }

  // una scheda per ogni evento di archivio-dati.js;
  // cliccando sulla scheda si apre l'elenco delle foto da cui scegliere
  (function(){
    var lista = document.getElementById('archivio-lista');
    if(!lista) return;
    function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    // miniatura: la stessa foto nella sottocartella "mini"
    function mini(src){ return /\/\d{3}\.jpg$/.test(src) ? src.replace(/\/(\d{3}\.jpg)$/, '/mini/$1') : src; }
    // anteprima della scheda: le foto dell'evento passano a caso,
    // mescolate, senza ripetersi finché non sono uscite tutte
    var ferme = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var visibili = new Set();
    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function(entries){
      entries.forEach(function(en){ en.isIntersecting ? visibili.add(en.target) : visibili.delete(en.target); });
    }, { rootMargin:'100px' }) : null;
    var vicino = 'IntersectionObserver' in window ? new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting && en.target.__prima){ en.target.__prima(); en.target.__prima = null; vicino.unobserve(en.target); }
      });
    }, { rootMargin:'600px' }) : null;
    function anteprima(tile, foto, k){
      var lastre = tile.querySelectorAll('.event-tile-photo .ph');
      var mazzo = [], cur = -1, vis = 0, attesa = false;
      function pesca(){
        if(!mazzo.length){
          mazzo = foto.map(function(_, i){ return i; });
          for(var j = mazzo.length - 1; j > 0; j--){
            var r = Math.floor(Math.random() * (j + 1)), t = mazzo[j]; mazzo[j] = mazzo[r]; mazzo[r] = t;
          }
          if(mazzo.length > 1 && mazzo[mazzo.length - 1] === cur){ mazzo.unshift(mazzo.pop()); }
        }
        return mazzo.pop();
      }
      cur = pesca();
      // la prima foto si scarica solo quando la scheda si avvicina allo schermo
      var prima = function(){ lastre[0].style.backgroundImage = "url('" + foto[cur] + "')"; };
      if(vicino){ tile.__prima = prima; vicino.observe(tile); } else { prima(); }
      if(ferme || foto.length < 2) return;
      var btn = tile.querySelector('.event-tile-photo');
      if(io){ io.observe(btn); } else { visibili.add(btn); }
      // ritmi diversi per ogni scheda, e solo per quelle sullo schermo
      setInterval(function(){
        if(document.hidden || attesa || !visibili.has(btn)) return;
        var i = pesca(), dopo = lastre[1 - vis], img = new Image();
        attesa = true;
        img.onload = function(){
          dopo.style.backgroundImage = "url('" + foto[i] + "')";
          dopo.classList.add('on');
          lastre[vis].classList.remove('on');
          vis = 1 - vis; cur = i; attesa = false;
        };
        img.onerror = function(){ attesa = false; };
        img.src = foto[i];
      }, 4200 + (k % 5) * 700 + Math.round(Math.random() * 600));
    }
    (window.ARCHIVIO || []).forEach(function(ev, k){
      var foto = ev.foto || [];
      var quando = [ev.luogo, ev.data].filter(Boolean).join(' — ');
      var nome = ev.titolo + (ev.data ? ' ' + ev.data : '');
      var tile = document.createElement('div');
      tile.className = 'event-tile' + (foto.length ? '' : ' no-foto');
      tile.innerHTML =
        (foto.length
          ? '<button type="button" class="event-tile-photo js-apri" aria-expanded="false" aria-controls="foto-' + k + '" aria-label="' + esc('Mostra le ' + foto.length + ' foto di ' + nome) + '"><span class="ph on"></span><span class="ph"></span></button>'
          : '<div class="event-tile-photo"><span>foto in arrivo</span></div>') +
        '<div class="event-tile-info">' +
          '<span class="event-tile-title">' + esc(ev.titolo) + '</span>' +
          (quando ? '<span class="event-tile-date">' + esc(quando) + '</span>' : '') +
          (ev.fotografo ? '<span class="event-tile-by">📷 ' + esc(ev.fotografo) + '</span>' : '') +
          (foto.length ? '<button type="button" class="event-tile-more js-apri" aria-expanded="false" aria-controls="foto-' + k + '">Guarda tutte le foto <span aria-hidden="true">&darr;</span></button>' : '') +
        '</div>' +
        (foto.length ? '<div class="event-grid" id="foto-' + k + '" hidden><div class="event-grid-head"><p class="event-grid-hint">Seleziona una foto</p><button type="button" class="event-grid-close">Chiudi</button></div><div class="event-grid-list"></div></div>' : '');
      if(foto.length){
        var griglia = tile.querySelector('.event-grid');
        var elenco = griglia.querySelector('.event-grid-list');
        var bottoni = tile.querySelectorAll('.js-apri');
        var pronta = false;
        function apriChiudi(){
          var apri = griglia.hidden;
          // le miniature si caricano solo la prima volta che si apre
          if(apri && !pronta){
            elenco.innerHTML = foto.map(function(src, i){
              return '<button type="button" class="event-thumb" data-i="' + i + '" aria-label="' + esc('Foto ' + (i + 1) + ' di ' + foto.length) + '"><img src="' + esc(mini(src)) + '" data-full="' + esc(src) + '" alt="" loading="lazy" onerror="if(this.dataset.full){this.src=this.dataset.full;this.dataset.full=\'\';}"></button>';
            }).join('');
            pronta = true;
          }
          griglia.hidden = !apri;
          tile.classList.toggle('open', apri);
          bottoni.forEach(function(b){ b.setAttribute('aria-expanded', apri); });
          var freccia = tile.querySelector('.event-tile-more span');
          if(freccia) freccia.innerHTML = apri ? '&uarr;' : '&darr;';
        }
        bottoni.forEach(function(b){ b.addEventListener('click', apriChiudi); });
        // telefono: "Chiudi" in cima al pannello (resta visibile mentre si scorre);
        // chiudendo si torna alla scheda dell'evento, non in mezzo alla pagina
        griglia.querySelector('.event-grid-close').addEventListener('click', function(){
          apriChiudi();
          tile.scrollIntoView({ behavior:ferme ? 'auto' : 'smooth', block:'start' });
          var b0 = tile.querySelector('.event-tile-more');
          if(b0){ b0.focus({ preventScroll:true }); }
        });
        elenco.addEventListener('click', function(e){
          var t = e.target.closest('.event-thumb');
          if(t && window.openLightbox) window.openLightbox(foto, +t.dataset.i);
        });
      }
      if(foto.length){ anteprima(tile, foto, k); }
      lista.appendChild(tile);
    });
  })();

</script>
