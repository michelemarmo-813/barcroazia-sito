<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventi passati — Bar Croazia</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="subpage">
<div class="sub-topline">
  <a class="back-btn" href="index.html#archivio">&larr; Indietro</a>
  <span>Bar Croazia &middot; Bologna</span>
</div>

<div class="page">

  <div class="sub-hero">
    <span class="tag mono">05a</span>
    <h1>Eventi passati</h1>
    <p>Le serate organizzate finora, con foto e informazioni. Clicca su una foto per sfogliare tutte quelle della serata.</p>
  </div>

  <main class="sub-main">
    <section class="zine-section revealed">
      <!-- gli eventi si modificano nel file archivio-dati.js -->
      <div class="event-tile-list" id="archivio-lista"></div>
    </section>
  </main>

  <footer>Bar Croazia &middot; movimento di poesia con poeti vivi</footer>

</div>

<script src="archivio-dati.js"></script>
<script>
  var revealEls = document.querySelectorAll('.zine-section');
  if('IntersectionObserver' in window){
    var revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('revealed');
          revealIO.unobserve(entry.target);
        }
      });
    }, { threshold:0.08, rootMargin:'0px 0px -40px 0px' });
    revealEls.forEach(function(el){ revealIO.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('revealed'); });
  }

  // una scheda per ogni evento di archivio-dati.js
  (function(){
    var lista = document.getElementById('archivio-lista');
    if(!lista) return;
    function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    (window.ARCHIVIO || []).forEach(function(ev){
      var foto = ev.foto || [];
      var quando = [ev.luogo, ev.data].filter(Boolean).join(' — ');
      var tile = document.createElement('div');
      tile.className = 'event-tile' + (foto.length ? '' : ' no-foto');
      tile.innerHTML =
        (foto.length
          ? '<button type="button" class="event-tile-photo" style="background-image:url(\'' + esc(foto[0]) + '\')" aria-label="' + esc('Foto di ' + ev.titolo + (ev.data ? ' ' + ev.data : '') + ' (' + foto.length + ')') + '"></button>'
          : '<div class="event-tile-photo"><span>foto in arrivo</span></div>') +
        '<div class="event-tile-info">' +
          '<span class="event-tile-title">' + esc(ev.titolo) + '</span>' +
          (quando ? '<span class="event-tile-date">' + esc(quando) + '</span>' : '') +
          (ev.fotografo ? '<span class="event-tile-by">\uD83D\uDCF7 ' + esc(ev.fotografo) + (foto.length ? ' · ' + foto.length + ' foto' : '') + '</span>' : '') +
        '</div>';
      if(foto.length){
        tile.querySelector('.event-tile-photo').addEventListener('click', function(){
          if(window.openLightbox) window.openLightbox(foto, 0);
        });
      }
      lista.appendChild(tile);
    });
  })();

</script>

<script src="lightbox.js"></script>
</body>
</html>
